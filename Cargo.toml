[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smohantty/rust-tizen"
homepage = "https://github.com/smohantty/rust-tizen"
authors = ["The rust-tizen contributors"]

[workspace.dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
tizen-dlog-sys = { version = "0.1.0", path = "crates/tizen-dlog-sys" }
tizen-dlog = { version = "0.1.0", path = "crates/tizen-dlog" }

# Register the custom `tizen` cfg as an expected name. Set by `cargo-tizen`
# via `--cfg tizen` in RUSTFLAGS to indicate "this build targets a Tizen
# device", activating native-library linkage in the `-sys` crates. The
# escape-hatch `feature = "tizen"` on individual crates does the same thing
# without needing the cfg flag.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(tizen)']

# Optimised release profile for on-device binaries. Override per-crate with
# `[profile.release]` if a specific binding needs different settings.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
