[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smohantty/rust-tizen"
homepage = "https://github.com/smohantty/rust-tizen"
authors = ["The rust-tizen contributors"]

[workspace.dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
tizen-dlog-sys = { version = "0.1.0", path = "crates/tizen-dlog-sys" }

# Register `target_vendor = "tizen"` as an expected cfg value. Tizen target triples
# (e.g. armv7l-tizen-linux-gnueabi) put `tizen` in the vendor field, but it isn't
# in rustc's built-in vendor list, so this silences `unexpected_cfgs` warnings.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_vendor, values("tizen"))']

# Optimised release profile for on-device binaries. Override per-crate with
# `[profile.release]` if a specific binding needs different settings.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
