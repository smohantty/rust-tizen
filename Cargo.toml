[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smohantty/rust-tizen"
homepage = "https://github.com/smohantty/rust-tizen"
authors = ["The rust-tizen contributors"]

[workspace.dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
bitflags = { version = "2.6", default-features = false }
wayland-client  = { version = "0.31", default-features = false }
wayland-backend = { version = "0.3",  default-features = false }
wayland-scanner = { version = "0.31", default-features = false }
tizen-dlog-sys = { version = "0.1.0", path = "crates/tizen-dlog-sys" }
tizen-dlog = { version = "0.1.0", path = "crates/tizen-dlog" }
tizen-app-sys = { version = "0.1.0", path = "crates/tizen-app-sys" }
tizen-app = { version = "0.1.0", path = "crates/tizen-app" }
tizen-input-sys = { version = "0.1.0", path = "crates/tizen-input-sys" }
tizen-input = { version = "0.1.0", path = "crates/tizen-input" }
tizen-tbm-sys = { version = "0.1.0", path = "crates/tizen-tbm-sys" }
tizen-screenshot-sys = { version = "0.1.0", path = "crates/tizen-screenshot-sys" }
tizen-screenshot = { version = "0.1.0", path = "crates/tizen-screenshot" }
tizen-window-sys = { version = "0.1.0", path = "crates/tizen-window-sys" }
tizen-window = { version = "0.1.0", path = "crates/tizen-window" }
tizen-egl-sys = { version = "0.1.0", path = "crates/tizen-egl-sys" }
tizen-egl = { version = "0.1.0", path = "crates/tizen-egl" }
tizen-egui = { version = "0.1.0", path = "crates/tizen-egui" }

# `cargo tizen build` injects `--cfg tizen`; register it as an expected cfg.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(tizen)']

# Optimised release profile for on-device binaries. Override per-crate with
# `[profile.release]` if a specific binding needs different settings.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
