[package]
name = "tizen-dlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Idiomatic Rust logging into Tizen's dlog system via the `log` facade"
categories = ["development-tools::debugging", "api-bindings"]
keywords = ["tizen", "dlog", "logging", "log"]
readme = "README.md"

[features]
default = []
# Forwarding feature — enables `tizen-dlog-sys/tizen` so libdlog gets linked
# even when not building through `cargo-tizen`. See that crate for context.
tizen = ["tizen-dlog-sys/tizen"]

[dependencies]
log = { workspace = true }
tizen-dlog-sys = { workspace = true }

[[example]]
name = "hello_dlog"
path = "examples/hello_dlog.rs"

[lints]
workspace = true
