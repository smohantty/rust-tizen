[package]
name = "tizen-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native Tizen Wayland window — zxdg_shell_v6 + wtz_shell + TBM, EFL-free"
categories = ["api-bindings", "gui"]
keywords = ["tizen", "wayland", "window", "xdg-shell", "tbm"]
readme = "README.md"

[dependencies]
tizen-window-sys = { workspace = true }
tizen-tbm-sys    = { workspace = true }
wayland-client   = { workspace = true }
wayland-backend  = { workspace = true, features = ["client_system", "dlopen"] }
# Universal ecosystem interop trait: lets softbuffer / glow / wgpu /
# ash / etc. discover the underlying `wl_display *` / `wl_surface *`
# without us having to take a dep on any specific UI framework.
raw-window-handle = "0.6"
bitflags          = { workspace = true }
# Standard Rust wayland event loop (used by winit on Linux). Gives us
# integrated wayland-fd polling + signal handling + future timer/IPC
# sources without rolling our own poll() loop.
calloop          = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
# Used to reset inherited SIG_IGN dispositions for SIGINT/SIGTERM
# before installing the signalfd handler; required because shell job
# control (`cmd &`) sets these to SIG_IGN, causing the kernel to drop
# them before signalfd can read them.
libc             = "0.2"

[lints]
workspace = true
