[package]
name = "tizen-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native Tizen Wayland window — zxdg_shell_v6 + wtz_shell + TBM, EFL-free"
categories = ["api-bindings", "gui"]
keywords = ["tizen", "wayland", "window", "xdg-shell", "tbm"]
readme = "README.md"

[dependencies]
tizen-window-sys = { workspace = true }
tizen-tbm-sys    = { workspace = true }
wayland-client   = { workspace = true }
wayland-backend  = { workspace = true, features = ["client_system", "dlopen"] }
# Universal ecosystem interop trait: lets softbuffer / glow / wgpu /
# ash / etc. discover the underlying `wl_display *` / `wl_surface *`
# without us having to take a dep on any specific UI framework.
raw-window-handle = "0.6"
bitflags          = { workspace = true }

[lints]
workspace = true
