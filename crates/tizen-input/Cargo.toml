[package]
name = "tizen-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Inject key/touch/pointer events into a Tizen Wayland compositor via tizen_input_device_manager"
categories = ["api-bindings", "hardware-support"]
keywords = ["tizen", "wayland", "input", "key", "injection"]
readme = "README.md"

[dependencies]
tizen-input-sys = { workspace = true }
wayland-client  = { workspace = true }
# `client_system` + `dlopen` keeps the FFI character (matches the project's
# -sys convention) and avoids any build-time dependency on libwayland-client.
wayland-backend = { workspace = true, features = ["client_system", "dlopen"] }
bitflags        = { workspace = true }

[lints]
workspace = true
