[package]
name = "tizen-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Idiomatic Rust wrapper for Tizen's app framework (lifecycle + app_control)"
categories = ["api-bindings", "os::unix-apis"]
keywords = ["tizen", "appfw", "lifecycle"]
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
log = { workspace = true }
tizen-app-sys = { workspace = true }
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "sync", "macros"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
