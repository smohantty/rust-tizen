[workspace]

[package]
name = "newsroom"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
eframe = { package = "tizen-eframe", path = "../../../crates/tizen-eframe" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
