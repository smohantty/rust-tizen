[workspace]

[package]
name = "a2ui-egui-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
tizen = { git = "https://github.com/smohantty/rust-tizen.git", features = ["window", "egl"] }
egui = "0.29"
egui_glow = "0.29"
glow = "0.14"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
