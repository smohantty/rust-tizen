[workspace]

[package]
name = "hello-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
tizen = { git = "https://github.com/smohantty/rust-tizen.git", features = ["app", "dlog"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
